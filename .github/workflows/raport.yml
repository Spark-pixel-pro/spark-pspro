name: Raport tygodniowy Spark

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  wyslij-raport:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install supabase groq pandas

      - name: Uruchom raport
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_HASLO: ${{ secrets.GMAIL_HASLO }}
          FIRMA_NAZWA: ${{ secrets.FIRMA_NAZWA }}
        run: python raport_tygodniowy.py
